<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RV Command — Live Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" />
<style>
  :root{
    --bg:#FFFFFF;--bg2:#F5F6F8;--panel:#FFFFFF;--panel2:#F0F1F4;
    --line:#E6E8EC;--line2:#D7DAE0;--text:#14161C;--mut:#5F6573;--mut2:#9AA0AD;
    --amber:#FF7A2F;--go:#0FB37A;--red:#E23744;--blue:#2F6FE0;--yellow:#C99700;
    --accent:#FF7A2F;--accent-text:#ffffff;
    --approve:#0FB37A;--approve-text:#ffffff;
    --pageaccent:#FF7A2F;--pageaccent-text:#ffffff;
    --disp:'Bricolage Grotesque',sans-serif;--body:'Geist',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}

  .app{display:flex;height:100vh}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
  .topbar{position:sticky;top:0;z-index:15;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:13px 22px;display:flex;align-items:center;gap:12px}
  .pgname{font-family:var(--disp);font-weight:700;font-size:19px;line-height:1.05}
  .pgsub{font-size:11.5px;color:var(--mut);margin-top:1px}
  .scroll{flex:1;overflow-y:auto;padding:22px 22px 70px}
  .inner{max-width:880px;margin:0 auto}

  .nav{width:248px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--line);height:100vh;display:flex;flex-direction:column}
  .navhead{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .logo{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:-.02em}
  .logo span{color:var(--accent)}
  .navhead .mono{font-family:var(--mono);font-size:10px;color:var(--mut2);letter-spacing:.1em;margin-top:2px}
  .navlist{flex:1;overflow-y:auto;padding:9px}
  .navitem{display:block;padding:9px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px;border-right:2px solid transparent}
  .navitem:hover{background:var(--panel2)}
  .navitem.active{background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.05);border-right-color:var(--accent)}
  .navitem .act{font-size:13.5px;font-weight:600;color:var(--mut)}
  .navitem.active .act{color:var(--text)}
  .navitem .full{font-family:var(--mono);font-size:10px;color:var(--mut2);margin-top:1px}
  .navitem.active .full{color:var(--accent)}
  .navfoot{padding:13px;border-top:1px solid var(--line)}

  .status{margin-left:auto;font-family:var(--mono);font-size:11px;padding:5px 11px;border-radius:8px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
  select.lot{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:7px 9px;font-family:var(--body);font-size:12.5px;max-width:150px}

  .burger{display:none;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;color:var(--text);padding:7px 11px;cursor:pointer;font-size:15px}
  .mobiletitle{display:none}
  .overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:none}
  .overlay.show{display:block}
  @media(max-width:860px){
    .nav{position:fixed;top:0;right:0;z-index:50;transform:translateX(100%);transition:transform .22s;box-shadow:-20px 0 40px rgba(0,0,0,.18)}
    .nav.open{transform:translateX(0)}
    .burger{display:inline-block}
    .topbar .pgname-wrap{display:none}
    .mobiletitle{display:block;font-family:var(--disp);font-weight:700;font-size:17px}
  }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .grid{display:grid;gap:14px}
  @media(min-width:680px){.cols-2{grid-template-columns:1fr 1fr}}
  .ttl{display:flex;align-items:baseline;gap:10px;margin:2px 0 14px}
  .ttl i{font-family:var(--mono);font-style:normal;font-size:12px;color:var(--accent)}
  .ttl b{font-family:var(--disp);font-weight:700;font-size:16px}
  .statrow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .stat{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat .l{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  .stat .v{font-family:var(--disp);font-weight:700;font-size:28px;line-height:1;margin-top:6px}
  table{width:100%;border-collapse:collapse}
  th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
  tr:last-child td{border-bottom:none}
  input,textarea,select.f{background:var(--bg2);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-family:var(--body);font-size:13px;width:100%}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .mono{font-family:var(--mono);font-size:12px;color:var(--mut)}
  button.b{font-family:var(--body);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:9px;cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--text);transition:.15s}
  button.b:hover{filter:brightness(.97)}
  button.b.p{background:var(--pageaccent);color:var(--pageaccent-text);border-color:transparent}
  button.b.g{background:var(--approve);color:var(--approve-text);border-color:transparent}
  button.b.d{background:transparent;color:var(--red);border-color:#E2374433}
  button.b.dim{background:transparent;color:var(--mut)}
  button.b.sm{padding:5px 10px;font-size:11.5px}
  button.b:disabled{opacity:.45;cursor:not-allowed}
  .badge{font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:6px;border:1px solid}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .note{font-size:12px;color:var(--mut);line-height:1.6}
  .lbl{font-family:var(--mono);font-size:10px;color:var(--mut);margin-bottom:4px;display:block}
  .addrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin-top:13px;align-items:end}
  .sms{background:var(--bg2);border:1px solid var(--line2);border-radius:18px;padding:16px;max-width:380px}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px;font-size:13.5px;line-height:1.5}
  .pipe{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pipe .step{font-family:var(--mono);font-size:12px;padding:8px 12px;background:var(--bg2);border-radius:8px;border:1px solid var(--line)}
  .pipe .arr{color:var(--accent);font-size:18px}
  .toggle{width:42px;height:24px;border-radius:20px;background:var(--line2);position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
  .toggle.on{background:var(--approve)}
  .toggle .k{width:18px;height:18px;border-radius:18px;background:#fff;position:absolute;top:3px;left:3px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .toggle.on .k{left:21px}
  .ro{background:#E6F8F1;border:1px solid #0FB37A55;border-radius:10px;padding:9px 14px;margin-bottom:16px;font-size:12.5px;color:#0A7A53}
  /* color editor */
  .crow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .crow:last-child{border-bottom:none}
  .swatch{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);flex-shrink:0}
  .cinfo{flex:1;min-width:120px}
  .cpick{width:46px;height:34px;padding:0;border:1px solid var(--line2);border-radius:8px;background:none;cursor:pointer}
  .cpick:disabled{cursor:not-allowed;opacity:.5}
  .locked{opacity:.6}
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div class="topbar">
      <div class="mobiletitle" id="mobileTitle">Runs Campaigns</div>
      <div class="pgname-wrap">
        <div class="pgname" id="pgName">Runs Campaigns</div>
        <div class="pgsub" id="pgSub">Autonomous ads + SMS approvals</div>
      </div>
      <select class="lot" id="lotSel" onchange="setLot(this.value)"></select>
      <div class="status" id="status">connecting…</div>
      <button class="burger" onclick="toggleNav(true)">☰</button>
    </div>
    <div class="scroll" id="scroll"><div class="inner" id="content"></div></div>
  </div>

  <div class="nav" id="nav">
    <div class="navhead">
      <div class="logo" id="brandLogo">RV<span>COMMAND</span></div>
      <div class="mono">MASTER OPS · LIVE</div>
    </div>
    <div class="navlist" id="navlist"></div>
    <div class="navfoot">
      <div class="row">
        <div style="width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700" id="roleBadge">E</div>
        <div style="font-size:12px"><div id="roleName" style="font-weight:600">GM / Exec</div><div class="mono" style="font-size:10px">Change in Controls Access</div></div>
      </div>
    </div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="toggleNav(false)"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
const SUPABASE_URL = "https://evikblpkyopdjbeuohpk.supabase.co";
const SUPABASE_KEY = "sb_publishable_j0mnfZtI9FCes8smx-KpGg_Ss4CJIsy";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================================================
   BRAND CONFIG — change THIS BLOCK ONLY to rebrand the app.
   Switch to a different dealer, or back to RVs, by editing here.
   Nothing else in the code hardcodes the brand.
   ============================================================ */
const BRAND = {
  nameTop: "SPARKS",          // first word in logo
  nameAccent: "TOYOTA",       // colored word in logo
  tagline: "MASTER OPS · LIVE",
  accentColor: "#EB0A1E",     // Toyota red (default accent if no saved theme)
  vehicleWord: "vehicle",     // "RV" / "camper" if you switch back
  vehicleWordPlural: "vehicles",
  // demo inventory shown across pages (swap for RVs or another dealer here):
  sampleInventory: [
    { stock:"4411", unit:"2026 Toyota Tacoma TRD Sport", price:42680, days:6,  status:"active",  velocity:"hot",  lot:"TX-AUS" },
    { stock:"4188", unit:"2026 Toyota RAV4 Hybrid XSE",  price:39150, days:51, status:"stagnant", velocity:"cold", lot:"TX-AUS" },
    { stock:"3902", unit:"2026 Toyota Camry XSE Hybrid",  price:36420, days:4,  status:"active",  velocity:"hot",  lot:"TX-HOU" },
    { stock:"4310", unit:"2026 Toyota 4Runner TRD",       price:52995, days:63, status:"stagnant", velocity:"cold", lot:"FL-ORL" },
    { stock:"4520", unit:"2026 Toyota Grand Highlander",  price:58740, days:9,  status:"active",  velocity:"warm", lot:"AZ-PHX" },
    { stock:"4099", unit:"2026 Toyota Tundra 1794",       price:63210, days:33, status:"active",  velocity:"warm", lot:"TX-AUS" },
  ],
};

const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n)=>"$"+Number(n).toLocaleString();
const badge=(t,c)=>`<span class="badge" style="color:${c};border-color:${c}55">${esc(t)}</span>`;
let LOT="ALL", ROLE="exec", THEME={};
const RO=()=>ROLE==="sales";
const ROLES={exec:["GM / Exec","E","var(--amber)","ALL"],lot:["Lot Manager","L","var(--blue)",["TX-AUS"]],sales:["Sales / Service","S","var(--go)",["TX-AUS"]]};
function lf(q,col="lot_id"){ return LOT==="ALL"?q:q.eq(col,LOT); }
function setStatus(ok,msg){const e=$("status");e.style.color=ok?"var(--go)":"var(--red)";e.style.borderColor=ok?"#0FB37A55":"#E2374455";e.textContent="● "+msg;}
function flash(){setStatus(true,"saved "+new Date().toLocaleTimeString());}
window.setLot=(v)=>{LOT=v;render();};
window.toggleNav=(o)=>{$("nav").classList.toggle("open",o);$("overlay").classList.toggle("show",o);};

/* contrast: pick black/white text for a given hex bg */
function textOn(hex){
  const h=hex.replace("#","");const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  const L=(0.299*r+0.587*g+0.114*b)/255; return L>0.62?"#14161C":"#ffffff";
}

const PAGES=[
  ["mkt","Runs Campaigns","Autonomous ads + SMS approvals"],
  ["deploy","Runs Your Ads","AI ad builder + smart budget split"],
  ["studio","Content Engine","Dump photos → grouped, staged, scheduled"],
  ["router","Moves Inventory","Cross-lot demand routing"],
  ["voice","Answers Calls","AI dispatcher + text queue"],
  ["protocol","Manages Scripts","Master outreach cadences"],
  ["pricing","Watches Competitors","Pricing intel + SMS swaps"],
  ["closer","Engages Leads","3-second speed-to-lead"],
  ["trade","Captures Trades","Trade-in intake + nurture"],
  ["service","Schedules Service","Predictive maintenance"],
  ["docs","Fills Paperwork","Auto contract pre-filing"],
  ["reviews","Builds Reviews","5-star reputation engine"],
  ["settings","Controls Access","Roles, permissions & colors"],
];
let CUR="mkt";

function applyTheme(){
  const acc=THEME.accent||"#FF7A2F", app=THEME.approve||"#0FB37A";
  const r=document.documentElement.style;
  r.setProperty("--accent",acc); r.setProperty("--accent-text",textOn(acc));
  r.setProperty("--approve",app); r.setProperty("--approve-text",textOn(app));
}
function applyPageAccent(){
  const col=THEME[CUR]||THEME.accent||"#FF7A2F";
  const r=document.documentElement.style;
  r.setProperty("--pageaccent",col); r.setProperty("--pageaccent-text",textOn(col));
}

function buildNav(){
  $("navlist").innerHTML=PAGES.map(([k,a,f])=>
    `<div class="navitem ${k===CUR?'active':''}" onclick="go('${k}')"><div class="act">${a}</div><div class="full">${esc(f)}</div></div>`).join("");
  const [name,letter,col]=ROLES[ROLE];
  const rb=$("roleBadge"); rb.textContent=letter; rb.style.color=col; rb.style.background=col.replace(')',', .12)').replace('var(','rgba('); 
  rb.style.background=col+"22"; rb.style.border="1px solid "+col+"55";
  $("roleName").textContent=name;
}
window.go=(k)=>{CUR=k;toggleNav(false);render();};

const velCol={hot:"var(--go)",warm:"var(--blue)",cold:"var(--amber)"};
const stageCol={hot:"var(--red)",routed:"var(--go)",qualifying:"var(--amber)",nurture:"var(--yellow)",closed:"var(--mut)"};
const BUILD={}; window.BUILD=BUILD;

async function render(){
  const p=PAGES.find(x=>x[0]===CUR);
  $("pgName").textContent=p[1];$("mobileTitle").textContent=p[1];$("pgSub").textContent=p[2];
  applyPageAccent(); buildNav();
  const allowed = ROLES[ROLE][3]==="ALL" ? [["ALL","All Lots (Global)"],["TX-AUS","Austin Megacenter"],["TX-HOU","Houston North"],["FL-ORL","Orlando Superstore"],["AZ-PHX","Phoenix Desert RV"]]
    : ROLES[ROLE][3].map(id=>[id,{ "TX-AUS":"Austin Megacenter","TX-HOU":"Houston North","FL-ORL":"Orlando Superstore","AZ-PHX":"Phoenix Desert RV"}[id]]);
  if(ROLES[ROLE][3]!=="ALL" && !ROLES[ROLE][3].includes(LOT)) LOT=ROLES[ROLE][3][0];
  if(ROLES[ROLE][3]==="ALL" && !["ALL","TX-AUS","TX-HOU","FL-ORL","AZ-PHX"].includes(LOT)) LOT="ALL";
  $("lotSel").innerHTML=allowed.map(([v,n])=>`<option value="${v}" ${v===LOT?"selected":""}>${esc(n)}</option>`).join("");
  $("scroll").scrollTop=0;
  const ro=(RO()&&CUR!=="settings")?`<div class="ro">● Read-only mode — Sales/Service can view but not edit.</div>`:"";
  $("content").innerHTML=ro+"<div id='pg'>Loading…</div>";
  try{ await BUILD[CUR](); }catch(e){ $("pg").innerHTML=`<div class="card" style="color:var(--red)">${esc(e.message||e)}</div>`; }
}

/* 01 */ BUILD.mkt=async()=>{
  const {data:bp}=await sb.from("budget_proposals").select("*").eq("status","pending").limit(1);const prop=bp&&bp[0];
  const inv=await lf(sb.from("inventory").select("*")).order("days_on_market",{ascending:false});
  const items=(inv.data||[]).slice(0,5).map(i=>`<tr><td class="mono">#${esc(i.stock)}</td><td>${esc(i.unit)}</td><td>${badge(i.velocity==="cold"?"boosting spend":i.velocity==="hot"?"spend reduced":"balanced",velCol[i.velocity])}</td><td class="mono">${i.days_on_market}d</td></tr>`).join("");
  $("pg").innerHTML=`<div class="statrow"><div class="stat"><div class="l">Active Spend MTD</div><div class="v" style="color:var(--go)">$3,180</div></div><div class="stat"><div class="l">Live Ad Variants</div><div class="v">38</div></div><div class="stat"><div class="l">Cost / Lead</div><div class="v" style="color:var(--go)">$11.40</div></div></div>
  <div class="ttl"><i>GUARDRAIL</i><b>3-to-7 day pre-approval</b></div>
  <div class="grid cols-2" style="margin-bottom:20px"><div class="card"><div class="note">Next month's spend is <b style="color:var(--text)">frozen</b> until approved by SMS. No dashboard login required.</div><div id="mktStatus" style="margin-top:12px">${prop?badge("● Awaiting SMS approval","var(--amber)"):badge("● No pending proposal","var(--mut)")}</div></div>
  <div class="sms"><div class="row" style="margin-bottom:9px"><div style="width:8px;height:8px;border-radius:8px;background:var(--go)"></div><span class="mono">GM · +1 (512) ••• 4471</span></div><div class="bubble">"Budget Proposal for ${prop?esc(prop.period):"June"}: ${prop?fmt(prop.amount):"$4,500"}. Reply 'APPROVE' to deploy or tap the secure link to scale up/down."</div><div class="row" style="margin-top:11px" id="mktBtns"><button class="b g sm" ${(!prop||RO())?"disabled":""} onclick="approveBudget('${prop?prop.id:""}')">Reply "APPROVE"</button><button class="b dim sm" ${RO()?"disabled":""}>Reply "Decline"</button></div></div></div>
  <div class="ttl"><i>LIVE</i><b>Inventory ⇄ ad-creative sync</b></div><div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Stock</th><th>Unit</th><th>Ad action</th><th>Days</th></tr></thead><tbody>${items}</tbody></table></div>`;
};
window.approveBudget=async(id)=>{if(!id)return;await sb.from("budget_proposals").update({status:"approved"}).eq("id",id);$("mktStatus").innerHTML=badge("● APPROVED — payment authorized, campaigns live","var(--go)");$("mktBtns").innerHTML=badge("✓ deployed instantly","var(--go)");flash();};

/* 02 — AD COMMAND: budget in → smart split → AI ad variants */
const AD_SPLIT_DEFAULT={ Meta:45, Google:35, TikTok:20 };
BUILD.deploy=async()=>{
  $("pg").innerHTML=`
   <div class="statrow">
     <div class="stat"><div class="l">Agency retainer</div><div class="v" style="color:var(--go)">$0</div></div>
     <div class="stat"><div class="l">Avg cost / lead</div><div class="v" style="color:var(--go)">↓ 31%</div></div>
     <div class="stat"><div class="l">Setup time</div><div class="v" style="font-size:18px">Under a minute</div></div>
   </div>
   <div class="ttl"><i>STEP 1</i><b>What's your ad budget this month?</b></div>
   <div class="card" style="margin-bottom:16px">
     <div class="row" style="gap:10px;align-items:flex-end">
       <div style="flex:1"><span class="lbl">MONTHLY AD SPEND ($)</span><input id="adBudget" type="number" value="5000"></div>
       <div><button class="b p" ${RO()?"disabled":""} onclick="adSplit()">Build my ad plan</button></div>
     </div>
     <div class="note" style="margin-top:10px">We recommend a split — but if you already crush it at 80% Google, keep rolling how you roll. You know your market; we just cut the spin and beat your agency's output.</div>
   </div>
   <div id="adPlan"></div>`;
};
window.adSplit=()=>{
  const budget=Math.max(0,Number($("adBudget").value)||0);
  const s={...AD_SPLIT_DEFAULT};
  const platforms=Object.keys(s);
  const dollar=(p)=>Math.round(budget*p/100);
  const rows=platforms.map(p=>{
    const col=p==="Meta"?"var(--blue)":p==="Google"?"var(--go)":"var(--yellow)";
    return `<div class="card" style="margin-bottom:10px">
      <div class="row"><b style="font-family:var(--disp);font-size:15px;flex:1">${p}</b>${badge(s[p]+"%",col)}<b class="mono" style="font-size:14px">${fmt(dollar(s[p]))}</b></div>
      <input type="range" min="0" max="100" value="${s[p]}" style="width:100%;margin-top:10px;accent-color:${col}" oninput="adAdjust('${p}',this.value)">
      <div id="adcopy_${p}" class="note" style="margin-top:8px;color:var(--mut2)">Tap "Write the ads" to generate ${p} variants with Claude.</div>
    </div>`;
  }).join("");
  $("adPlan").innerHTML=`
    <div class="ttl"><i>STEP 2</i><b>Recommended split — adjust freely</b></div>
    <div id="adRows">${rows}</div>
    <div class="row" style="margin:6px 0 16px"><b class="mono" id="adTotal">Total: ${fmt(budget)} / mo · 100% allocated</b></div>
    <div class="row"><button class="b p" ${RO()?"disabled":""} onclick="adWrite()">✍️ Write the ads (Claude)</button></div>
    <div class="note" style="margin-top:10px;color:var(--mut2)">Live launch to Meta / Google / TikTok turns on once your ad-account access is connected. The system is wired and ready for those tokens.</div>`;
  window.__adState={budget,s};

window.ceApprove=async()=>{
  const now=new Date(); let day=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const sched=CE_groups.map((g,i)=>{ day=new Date(day); day.setDate(day.getDate()+(i===0?1:3)); const [tm]=CE_TIMES[g.type]; const hour=tm.includes("7:00pm")?19:tm.includes("11:00")?11:12; const d=new Date(day); d.setHours(hour,0,0,0); return {...g,date:d,time:tm}; });
  ceRenderCal(sched);
  $("ceGroups").innerHTML="";
  try{ for(const s of sched){ await sb.from("social_posts").insert({vehicle_group:s.name,post_type:s.type,caption:s.caption,scheduled_for:s.date.toISOString(),best_time_reason:CE_TIMES[s.type][1],status:"scheduled",approved:true,lot_id:LOT==="ALL"?"TX-AUS":LOT}); } }catch(e){}
  flash();
};
function ceRenderCal(sched){
  const now=new Date(),year=now.getFullYear(),month=now.getMonth();
  const first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();
  const byDay={}; sched.forEach(s=>{const d=s.date.getDate();(byDay[d]=byDay[d]||[]).push(s);});
  const dows=["S","M","T","W","T","F","S"];
  const pcol={photo:"var(--blue)",reel:"var(--yellow)",carousel:"var(--amber)"};
  let cells=dows.map(d=>`<div class="mono" style="font-size:9px;color:var(--mut);text-align:center;padding:3px 0">${d}</div>`).join("");
  for(let i=0;i<first;i++) cells+=`<div></div>`;
  for(let d=1;d<=days;d++){ const posts=(byDay[d]||[]).map(s=>`<div style="margin-top:3px;border-radius:5px;padding:2px 4px;font-size:8.5px;font-weight:600;color:#fff;background:${pcol[s.type]};line-height:1.25">${s.name.split(' ').slice(1,3).join(' ')}<div class="mono" style="font-size:7.5px;opacity:.85">${s.time}</div></div>`).join(""); cells+=`<div style="min-height:60px;border:1px solid var(--line);border-radius:7px;padding:4px;background:var(--panel)"><div class="mono" style="font-size:9px;color:var(--mut2)">${d}</div>${posts}</div>`; }
  const reels=sched.filter(s=>s.type==="reel").length, rest=sched.length-reels, prev=15;
  const flag = sched.length<prev
    ? `<div class="card" style="background:#FFF7E6;border-color:var(--amber);margin-bottom:14px"><div class="row"><span style="font-size:18px">⚠️</span><div style="flex:1;font-size:13px"><b>Scheduled ${sched.length} posts — under last month's ${prev}.</b> Consistent volume protects your algorithmic momentum; dropping below last month can cost reach. Auto-fill ${prev-sched.length} more from remaining inventory?</div><button class="b p sm" onclick="this.closest('.card').innerHTML='✓ Added ${prev-sched.length} more — cadence held at ${prev}.'">Auto-fill</button></div></div>`
    : `<div class="card" style="background:#E9F9F2;border-color:var(--go);margin-bottom:14px"><div class="note" style="color:#0A7A53"><b>Cadence healthy.</b> ${sched.length} posts at or above last month's ${prev}.</div></div>`;
  $("ceCal").innerHTML=`
    <div class="statrow"><div class="stat"><div class="l">Posts this month</div><div class="v">${sched.length}</div></div><div class="stat"><div class="l">Reels</div><div class="v" style="color:var(--yellow)">${reels}</div></div><div class="stat"><div class="l">Photo/carousel</div><div class="v" style="color:var(--blue)">${rest}</div></div><div class="stat"><div class="l">Last month</div><div class="v" style="color:var(--mut)">${prev}</div></div></div>
    ${flag}
    <div class="ttl"><i>STEP 4</i><b>Scheduled automatically — best time per format</b></div>
    <div class="note" style="margin-bottom:10px">Each post placed at the peak window <b>for its format</b> — reels and photos post at different times. Drag to move only if you want. <span style="color:var(--mut2)">(Self-tuning to your audience unlocks with a few weeks of your data — Phase 2.)</span></div>
    <div class="row" style="gap:12px;margin-bottom:10px">${badge("● photo 12pm","var(--blue)")}${badge("● reel 7pm","var(--yellow)")}${badge("● carousel 11am","var(--amber)")}</div>
    <div class="card" style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${cells}</div>`;
  $("ceCal").scrollIntoView({behavior:"smooth"});
}

/* 12 — REVIEWS / CSI RECOVERY: intercept the dealer report card before it hurts the score */
const CSI_FIX={
  Cleanliness:["a complimentary full detail","We're so sorry the vehicle wasn't spotless. If we set you up with a free full detail this week, would that bring it to a 10?"],
  "Service speed":["priority next-visit scheduling + a loaner","Sorry your visit ran long. If we guarantee priority scheduling and a loaner next time, would that make it a 10?"],
  "Finance experience":["a sit-down with our finance manager to make it right","Sorry the finance step felt rushed. Can our finance manager call you personally to walk it through and make it right — would that get us to a 10?"],
  Communication:["a direct line to your salesperson + a callback today","Sorry you felt out of the loop. If your salesperson calls you back today with everything you need, would that earn a 10?"],
};
BUILD.reviews=async()=>{
  const {data}=await lf(sb.from("reviews").select("*")).order("created_at",{ascending:false});
  const st={pending:["survey sent","var(--amber)"],"5star":["10/10 → pushed to Google","var(--go)"],flagged:["recovered → routed to manager","var(--red)"]};
  const rows=(data||[]).map(r=>`<div class="card" style="margin-bottom:10px"><div class="row"><div style="flex:1;min-width:160px"><b style="font-size:14px">${esc(r.customer_name)}</b><div class="note" style="margin-top:3px">${esc(r.event)}</div></div>${badge("● "+st[r.state][0],st[r.state][1])}</div></div>`).join("")||`<div class="note">No surveys yet.</div>`;
  $("pg").innerHTML=`
   <div class="statrow">
     <div class="stat"><div class="l">CSI Score</div><div class="v" style="color:var(--go)">9.7</div></div>
     <div class="stat"><div class="l">Saved before Toyota saw it</div><div class="v" style="color:var(--amber)">23</div></div>
     <div class="stat"><div class="l">Pushed to Google</div><div class="v">129</div></div>
   </div>
   <div class="card" style="margin-bottom:16px;border-color:#E2374433"><div class="note"><b style="color:var(--red)">Why this matters:</b> the manufacturer's survey punishes anything under a perfect 10. We reach your customer <b>first</b>, catch the gripe, fix it, and turn it into a 10 — before it ever hits your report card. Thrilled customers get pushed to Google.</div></div>

   <div class="ttl"><i>STEP 1</i><b>What the customer receives (live mock)</b></div>
   <div class="card" style="margin-bottom:16px">
     <div class="row" style="gap:10px;align-items:flex-end">
       <div style="flex:1"><span class="lbl">PICK A SAMPLE GRIPE</span>
         <select class="f" id="csiGripe">${Object.keys(CSI_FIX).map(k=>`<option>${k}</option>`).join("")}</select></div>
       <div><button class="b p" ${RO()?"disabled":""} onclick="csiMock()">Show the recovery flow</button></div>
     </div>
     <div id="csiMock" style="margin-top:14px"></div>
   </div>

   <div class="ttl"><i>LIVE</i><b>Survey pipeline</b></div>${rows}`;
};
window.csiMock=()=>{
  const g=$("csiGripe").value; const [fix,line]=CSI_FIX[g];
  $("csiMock").innerHTML=`
   <div class="sms" style="margin-bottom:10px">
     <div class="row" style="margin-bottom:9px"><div style="width:8px;height:8px;border-radius:8px;background:var(--go)"></div><span class="mono">Sparks Toyota · survey · 843-•••</span></div>
     <div class="bubble">Thanks for your visit! Quick 1 question before Toyota's survey: how would you rate us 1–10? Reply with a number.</div>
   </div>
   <div class="row" style="justify-content:flex-end;margin-bottom:10px"><div class="bubble" style="background:var(--accent);color:#fff;max-width:60%">9 — ${g.toLowerCase()} could've been better</div></div>
   <div class="sms" style="margin-bottom:10px">
     <div class="bubble">${esc(line)}</div>
   </div>
   <div class="row" style="justify-content:flex-end;margin-bottom:10px"><div class="bubble" style="background:var(--accent);color:#fff;max-width:60%">Yeah, that'd do it — 10/10</div></div>
   <div class="card" style="background:#E9F9F2;border-color:var(--go)">
     <div class="note" style="color:#0A7A53"><b>Recovered.</b> We offered <b>${esc(fix)}</b>, the customer confirmed a 10, and a manager is being looped in to deliver it personally. The bad score never reaches Toyota — and we book them back in the door.</div>
     <div class="row" style="margin-top:10px"><button class="b g sm" onclick="this.outerHTML='${badge("● manager notified via Twilio · customer booked","var(--go)")}'">Notify manager + book</button></div>

   <div class="note" style="margin-top:10px;color:var(--mut2)">Live version: Claude reads any free-text complaint, picks the right make-good, and texts the matched manager. Always loops in a real person.</div>`;
};

/* 13 */ BUILD.settings=async()=>{
  const {data:users}=await sb.from("app_users").select("*").order("role");
  const {data:colors}=await sb.from("theme_settings").select("*").order("sort");
  const matrix=[["Capability","Exec","Lot Mgr","Sales"],["Multi-lot dropdown","All","Assigned","—"],["Ad budget override","✓","—","—"],["Global Sync","✓","—","—"],["Edit voice/queues","✓","Own lot","—"],["Local templates","✓","Own lot","—"],["Customer threads","✓","✓","Read-only"],["Recolor action buttons","All pages","Own pages","—"],["Backend config","✓","—","—"]];
  const roleCards=Object.entries(ROLES).map(([k,v])=>`<div class="card" style="cursor:pointer;flex:1;min-width:170px;border-color:${ROLE===k?v[2]:'var(--line)'}" onclick="setRole('${k}')"><div class="row"><div style="width:9px;height:9px;border-radius:9px;background:${v[2]}"></div><b>${v[0]}</b></div><div class="note" style="margin-top:6px">${v[3]==="ALL"?"Global · all lots":"Locked to "+v[3].join(", ")}${k==="sales"?" · read-only":""}</div></div>`).join("");

  // permission for editing a given color row
  const canEdit=(scope)=> ROLE==="exec" ? true : (ROLE==="lot" ? scope==="lot" : false);
  const colorRow=(c)=>{
    const editable=canEdit(c.scope);
    return `<div class="crow ${editable?'':'locked'}">
      <div class="swatch" style="background:${esc(c.color)}"></div>
      <div class="cinfo"><div style="font-weight:600;font-size:13.5px">${esc(c.label)}</div>
        <div class="row" style="gap:6px;margin-top:3px">${badge(c.scope==='exec'?'exec only':'lot-level',c.scope==='exec'?'var(--amber)':'var(--blue)')}<span class="mono">${esc(c.color)}</span>${editable?'':badge('🔒 no permission','var(--mut2)')}</div></div>
      <input type="color" class="cpick" value="${esc(c.color)}" ${editable?'':'disabled'} onchange="saveColor('${c.key}',this.value)">
    </div>`;
  };
  const globals=(colors||[]).filter(c=>c.scope==='exec'&&(c.key==='accent'||c.key==='approve'));
  const pageColors=(colors||[]).filter(c=>c.key!=='accent'&&c.key!=='approve');
  const editableCount=pageColors.filter(c=>canEdit(c.scope)).length;

  $("pg").innerHTML=`
  <div class="ttl"><i>ROLE</i><b>Test as a role (drives the whole app)</b></div>
  <div class="row" style="margin-bottom:18px">${roleCards}</div>

  <div class="ttl"><i>APPEARANCE</i><b>Action button & accent colors</b></div>
  <div class="card" style="margin-bottom:14px">
    <div class="note" style="margin-bottom:6px">${ROLE==='exec'?"As GM/Exec you can recolor every page plus the global accent.":ROLE==='lot'?`As a Lot Manager you can recolor only the pages within your authority (${editableCount} pages). Exec-controlled pages are locked.`:"Sales/Service can't change colors — read-only."}</div>
    ${ROLE==='sales'?'':`<div style="margin-top:6px">${globals.map(colorRow).join("")}</div>`}
  </div>
  <div class="card" style="margin-bottom:18px">
    <div class="lbl" style="margin-bottom:4px">PER-PAGE ACTION COLORS</div>
    ${pageColors.map(colorRow).join("")}
    <div class="row" style="margin-top:14px"><button class="b dim sm" onclick="resetColors()">Reset all to default</button></div>
  </div>

  <div class="ttl"><i>USERS</i><b>Accounts (live)</b></div>
  <div class="card" style="padding:0;overflow:auto;margin-bottom:18px"><table><thead><tr><th>Email</th><th>Role</th><th>Lot IDs</th></tr></thead><tbody>${(users||[]).map(u=>`<tr><td>${esc(u.email)}</td><td>${badge(u.role,ROLES[u.role]?ROLES[u.role][2]:'var(--mut)')}</td><td class="mono">${esc((u.lot_ids||[]).join(", "))}</td></tr>`).join("")}</tbody></table></div>

  <div class="ttl"><i>MATRIX</i><b>Operational permissions</b></div>
  <div class="card" style="padding:0;overflow:auto"><table><tbody>${matrix.map((r,ri)=>`<tr style="${ri===0?'background:var(--bg2)':''}">${r.map((c,ci)=>`<td style="${ri===0?'font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--mut)':''};${ci===0&&ri?'font-weight:600':''};color:${ri===0?'var(--mut)':ci===0?'var(--text)':c==='✓'?'var(--go)':c==='—'?'var(--mut2)':'var(--amber)'}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <div class="note" style="margin-top:14px">Color permissions mirror operational scope: a single-location admin can restyle only the pages they manage. In production these gate on the manager's <span class="mono" style="color:var(--accent)">lot_ids</span> and write per-lot themes.</div>`;
};
window.setRole=(k)=>{ROLE=k;render();};
window.saveColor=async(key,val)=>{
  const {error}=await sb.from("theme_settings").update({color:val}).eq("key",key);
  if(error){alert(error.message);return;}
  THEME[key]=val; applyTheme(); applyPageAccent(); render(); flash();
};
window.resetColors=async()=>{
  const editableKeys=(await sb.from("theme_settings").select("*")).data.filter(c=> ROLE==="exec"||(ROLE==="lot"&&c.scope==="lot"));
  for(const c of editableKeys){ const def=(c.key==='approve')?'#0FB37A':'#FF7A2F'; await sb.from("theme_settings").update({color:def}).eq("key",c.key); THEME[c.key]=def; }
  applyTheme(); applyPageAccent(); render(); flash();
};

async function loadTheme(){
  const {data}=await sb.from("theme_settings").select("key,color");
  THEME={}; (data||[]).forEach(r=>THEME[r.key]=r.color); applyTheme();
}

(function applyBrand(){
  const lg=$("brandLogo"); if(lg) lg.innerHTML = `${BRAND.nameTop}<span>${BRAND.nameAccent}</span>`;
  document.querySelectorAll(".mono").forEach(el=>{ if(el.textContent.trim()==="MASTER OPS · LIVE") el.textContent=BRAND.tagline; });
  // seed default accent if no saved theme yet
  document.documentElement.style.setProperty("--amber", BRAND.accentColor);
})();

(async function(){
  try{ const {error}=await sb.from("lots").select("id").limit(1); if(error) throw error;
    setStatus(true,"rv-command-master"); await loadTheme(); render();
  }catch(e){ setStatus(false,"open in a real browser"); $("content").innerHTML=`<div class="card" style="color:var(--red)">Couldn't reach Supabase: ${esc(e.message||e)}.<br><br>If you're seeing this inside the Claude chat preview, that's expected — the preview blocks outside connections. Download this file and open it in your phone or computer browser.</div>`; }
})();
</script>
